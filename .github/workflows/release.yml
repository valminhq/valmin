# A tag's artefacts: the archive, its checksums and inventories, and the panel image.
# Triggered by a tag and nothing else, and ci.yml writes only to a pull request branch, so a
# pull request has no path to publishing. The release itself is a draft (.goreleaser.yaml).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.13.1
  GORELEASER_VERSION: v2.18.1
  IMAGE: ghcr.io/${{ github.repository_owner }}/valmind

jobs:
  # A tag does not skip the checks, and a failure here stops both publishing jobs.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser reads the tag history to derive the version and the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Built from docker/valmind/Dockerfile rather than assembled by goreleaser, so the runtime
  # contract is stated once and cannot drift between the two (08 §2, ADR-169).
  image:
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/valmind/Dockerfile
          push: true
          # deploy/compose.yaml pins a digest; these exist so there is something to resolve.
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
