# A tag's artefacts: the archive, its checksums and inventories, and the panel and game images.
# The release stays a draft until the publish job is approved.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.18.1
  IMAGE: ghcr.io/${{ github.repository_owner }}/valmind
  GAME_IMAGE: ghcr.io/${{ github.repository_owner }}/valheim

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    # A called workflow's jobs may not ask for more than this; ci.yml's changes job asks
    # for pull-requests: read.
    permissions:
      contents: write
      pull-requests: read

  release:
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser reads the tag history to derive the version and the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/valmind/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
      # Tagged with the panel's version.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/valheim
          push: true
          tags: ${{ env.GAME_IMAGE }}:${{ github.ref_name }}
          provenance: true
          sbom: true

  # Waits for approval on the release environment, then moves :latest (except for a
  # prerelease) and publishes the draft.
  publish:
    needs: image
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the release's images and publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != true ]; then
            for name in valmind valheim; do
              docker buildx imagetools create --tag "$REGISTRY/$name:latest" "$REGISTRY/$name:$TAG"
            done
          fi
          gh release edit "$TAG" --draft=false
