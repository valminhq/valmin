name: Renovate

on:
  schedule:
    - cron: '0 4 */3 * *' # Runs at 04:00 every third day of the month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ secrets.RENOVATE_PAT }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
