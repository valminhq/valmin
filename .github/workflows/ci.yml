name: CI

on:
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only; only the pre-commit job elevates, to push its fixer commit.
permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.13.1
  GORELEASER_VERSION: v2.18.1
  # Branch tip for a pull request from this repository, so every job sees the fixer commit.
  # A fork has no tip to push to and keeps the merge commit, as do push and workflow_call.
  CHECKOUT_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.sha }}

jobs:
  # Fixes what it can, pushes that, then gates on what it could not. The detectors that
  # duplicate the go job are skipped: golangci-lint and gocyclo are `make lint-go`.
  pre-commit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SKIP: golangci-lint,go-build,go-cyclo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit

      - if: github.event.pull_request.head.repo.full_name == github.repository
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        continue-on-error: true

      - if: github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "style: pre-commit autofix"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  go:
    needs: [pre-commit]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          # internal/version reads the vcs stamps of this checkout.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Installed rather than run through golangci-lint-action: `make lint-go` is the
      # interface (CLAUDE.md §11).
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - run: make lint-go
      - run: make test-go

  # Every supported Node version. web/.nvmrc is what the other jobs build on and has to be
  # one of these.
  web:
    needs: [pre-commit]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make lint-web
      - run: make test-web
      - run: make web-build

  # Built once for both integration jobs, never the real ~1 GB game download (06 §4). Waits
  # on the checks because the panel image compiles the binary and the SPA itself.
  images:
    needs: [go, web]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - run: make images
      - run: make save-images
      # A docker save is a tar of layer tars, so the default zip pass buys nothing.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-images
          path: images.tar
          compression-level: 0
          retention-days: 1

  # The release path, exercised on every revision rather than discovered by a tag.
  release-artifacts:
    needs: [go, web]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          # goreleaser derives the snapshot version from the tag history.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: ${{ env.GORELEASER_VERSION }}
      - run: make release-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-artifacts
          path: dist/*.tar.gz
          retention-days: 7

  integration:
    needs: [images]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # The suite embeds the SPA, so this job builds it; it does not lint or test it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-images
      - run: make load-images
      - run: make test-integration-run

  # The only job that runs provisioning's success branch: A4 fails on every uid that is not
  # 10000, which is every runner and every dev machine (A3, A4, 08 §2).
  integration-as-panel:
    needs: [images]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-images
      - run: make load-images
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends acl
      - run: make dev-setup
      - run: make test-integration-as-panel-run
