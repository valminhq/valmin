# The jobs are split along the lines the work actually divides on: the Go checks do not
# depend on the Node version and run once, the web checks run on every supported Node
# version, and the two integration jobs share one build of the game and panel images
# rather than building the same four images twice.
name: CI

on:
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_call:

# A superseded pull request run has nothing left to report. Pushes to main and the run a
# tag calls are never cancelled: their result is the record that the revision was checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only except the pre-commit job, which elevates to push its fixer commit. Nothing here
# may publish: publication lives in release.yml behind a tag.
permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.13.1
  GORELEASER_VERSION: v2.18.1
  # The branch tip for a pull request from this repository, so every job below sees the
  # pre-commit job's fixer commit. A fork has no tip to push to, so it keeps the merge
  # commit github.sha already names, as do push and workflow_call.
  CHECKOUT_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.sha }}

jobs:
  # Runs first so the rest of the workflow tests what the fixers produced rather than what
  # was pushed. The detectors that duplicate the go job below are skipped here: golangci-lint
  # and gocyclo are `make lint-go`, and compiling is `make test-go`.
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      SKIP: golangci-lint,go-build,go-cyclo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # go-mod-tidy calls go, and the gitleaks hook builds from source.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The hook environments, which otherwise rebuild every run. Keyed on the config, which
      # is what decides their contents.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The CLI rather than pre-commit/action, which is unmaintained and pins a Node 20
      # actions/cache the runner now warns about.
      - run: pip install pre-commit

      # The fixing pass and the commit carrying it, for a pull request from this repository
      # only: nothing else has a branch to push to. Skipping both leaves the gate below to
      # report on a push and a fork rather than silently repairing them.
      - if: github.event.pull_request.head.repo.full_name == github.repository
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        continue-on-error: true

      - if: github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "style: pre-commit autofix"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # The gate: what the fixers could not resolve fails here.
      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  # The Go half. It needs no Node: web/build carries a .gitignore, so the SPA embed compiles
  # on a fresh checkout. What the embed is worth is asserted by release-artifacts, which
  # builds the real artefact and reads the assets back out of it.
  go:
    needs: [pre-commit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          # internal/version reads the vcs stamps of this checkout.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      # Installed rather than run through golangci-lint-action: `make lint-go` is the
      # interface (CLAUDE.md §11), and a second invocation beside it is a second
      # configuration to drift.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - run: make lint-go
      - run: make test-go

  # The web half, on every Node version the project supports. Building the SPA here is what
  # makes a version-specific build failure a failure of this matrix leg rather than of a
  # later job that happens to use one of them. The version every other job builds on is
  # web/.nvmrc, and it has to be one of these.
  web:
    needs: [pre-commit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make lint-web
      - run: make test-web
      - run: make web-build

  # The stub images and the panel image, built once for both integration jobs. Never the
  # real ~1 GB game download (06 §4).
  images:
    needs: [pre-commit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - run: make images
      - run: make save-images
      # Compressed already: a docker save is a tar of layer tars, so the default zip pass
      # costs runner time for nothing.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-images
          path: images.tar
          compression-level: 0
          retention-days: 1

  # The release path, exercised on every revision rather than discovered by a tag.
  release-artifacts:
    needs: [go, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
          # goreleaser derives the snapshot version from the tag history.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: ${{ env.GORELEASER_VERSION }}
      - run: make release-check
      # The snapshot artefacts, kept so a candidate can be inspected without a tag.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-artifacts
          path: dist/*.tar.gz
          retention-days: 7

  integration:
    needs: [images, go, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # The suite embeds the SPA, so this job builds it; it does not lint or test it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-images
      - run: make load-images
      - run: make test-integration-run

  # The only job in which provisioning's success branch runs at all: TestCreateInstance-
  # ProvisionsEndToEnd asserts A4's failure on every uid that is not 10000, which is every
  # runner and every dev machine. Without this job the clone, the game update and the whole
  # success path are never executed anywhere (A3, A4, 08 §2).
  integration-as-panel:
    needs: [images, go, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: integration-images
      - run: make load-images
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends acl
      - run: make dev-setup
      - run: make test-integration-as-panel-run
