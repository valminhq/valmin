# Moves :latest to a release's panel and game images once the draft release is published.
# A prerelease keeps only its version tag.
name: Publish latest

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  latest:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point latest at the release's images
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for name in valmind valheim; do
            docker buildx imagetools create --tag "$REGISTRY/$name:latest" "$REGISTRY/$name:$TAG"
          done
