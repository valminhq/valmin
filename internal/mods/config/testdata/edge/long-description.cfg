[General]

## Controls how the mod resolves a conflict between two structures placed on the same tile.
## Keep places the structure that was there first and discards the new one.
## Replace removes the older structure, including anything stored inside it.
## Ask defers the decision, which on a dedicated server means the same as Keep.
##
# Setting type: String
# Default value: Keep
# Acceptable values: Keep, Replace, Ask
ConflictPolicy = Replace
