[Caching]

## Enable or disable the assembly metadata cache.
## Speeds up plugin discovery by remembering the types found on a previous run.
# Setting type: Boolean
# Default value: true
EnableAssemblyCache = true

[Chainloader]

## Hide the manager object from the engine.
## Some older plugins look the object up by name and stop working when it is hidden.
## 
# Setting type: Boolean
# Default value: false
HideManagerGameObject = false

[Harmony.Logger]

## Which patcher log channels to listen to.
## NOTE: the IL channel dumps whole patched methods and is slow.
# Setting type: LogChannel
# Default value: Warn, Error
# Acceptable values: None, Info, IL, Warn, Error, Debug, All
# Multiple values can be set at the same time by separating them with , (e.g. Debug, Warning)
LogChannels = Warn, Error

[Logging]

## Show engine log messages in the framework log.
# Setting type: Boolean
# Default value: true
UnityLogListening = true

[Logging.Console]

## Show a console for log output.
# Setting type: Boolean
# Default value: false
Enabled = true

## Which log levels reach the console.
# Setting type: LogLevel
# Default value: Fatal, Error, Warning, Message, Info
# Acceptable values: None, Fatal, Error, Warning, Message, Info, Debug, All
# Multiple values can be set at the same time by separating them with , (e.g. Debug, Warning)
LogLevels = Fatal, Error, Warning, Message, Info

ForceTTYDriver = true

[Logging.Disk]

## Write log messages to disk.
# Setting type: Boolean
# Default value: true
Enabled = true

## Append to the log file instead of overwriting it at startup.
# Setting type: Boolean
# Default value: false
AppendLog = false

## Which log levels are saved to the disk log.
# Setting type: LogLevel
# Default value: Fatal, Error, Warning, Message, Info
# Acceptable values: None, Fatal, Error, Warning, Message, Info, Debug, All
# Multiple values can be set at the same time by separating them with , (e.g. Debug, Warning)
LogLevels = Fatal, Error, Warning, Message, Info

[Preloader.Entrypoint]

## The local filename of the assembly to target.
# Setting type: String
# Default value: Engine.CoreModule.dll
Assembly = Engine.CoreModule.dll

## The method to hook the chainloader onto.
# Setting type: String
# Default value: .cctor
Method = .cctor

