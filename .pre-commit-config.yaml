repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-yaml
    # testdata is byte-exact: a fixture encodes the whitespace its name states, so these
    # three rewrite it rather than tidy it (ADR-120, 03 §3.5).
    - id: end-of-file-fixer
      exclude: (^|/)testdata/
    - id: trailing-whitespace
      exclude: (^|/)testdata/
    - id: check-added-large-files
    - id: detect-private-key
    - id: mixed-line-ending
      args: [--fix=lf]
      exclude: (^|/)testdata/

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-mod-tidy
      - id: go-cyclo
        args: [-over=15]
        # Test files are excluded here for the reason .golangci.yml already excludes them
        # from gocyclo: a table-driven test's assertion sequence is its documentation, not
        # complexity. Without this the hook and the linter disagree about the same file, and
        # the hook wins only for whichever test a commit happens to touch.
        exclude: _test\.go$
      - id: no-go-testing
      - id: golangci-lint
      - id: go-build

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
