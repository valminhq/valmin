# The panel behind a TLS-terminating Caddy, with access to Docker through a socket proxy. Game
# containers are created by the panel as siblings on the host's Docker.
#
# Copy .env.example to .env, fill it in, run ./prepare-host.sh, then `docker compose up -d`.
name: valmin

services:
  valmind:
    image: ${VALMIN_IMAGE:?set VALMIN_IMAGE, pinned by digest}
    restart: unless-stopped
    # The panel and every game container run as uid 10000, which owns the data root.
    user: "10000:10000"
    environment:
      # Plain HTTP on the Caddy-facing address only.
      VALMIN_SERVER_LISTEN: ${VALMIN_SUBNET_PREFIX:-10.89}.13.3:8080
      # The browser origin, used for invite links and origin checks.
      VALMIN_SERVER_EXTERNAL_URL: https://${VALMIN_DOMAIN:?}
      # Caddy's address alone, so no other container can set forwarded headers.
      VALMIN_SERVER_TRUSTED_PROXIES: ${VALMIN_SUBNET_PREFIX:-10.89}.13.2/32
      # The data root inside the container and on the host. The panel checks they match at
      # startup.
      VALMIN_DATA_ROOT: /srv/valmin
      VALMIN_DATA_HOST_ROOT: ${VALMIN_HOST_DATA_ROOT:?}
      VALMIN_GAME_IMAGE: ${VALMIN_GAME_IMAGE:?set VALMIN_GAME_IMAGE, pinned by digest}
      # The network the panel creates game containers on.
      VALMIN_GAME_NETWORK: valmin-games
      VALMIN_DOCKER_ENDPOINT: tcp://docker-proxy:2375
      VALMIN_GAME_STEAMCMD_IMAGE: ${VALMIN_STEAMCMD_IMAGE:-steamcmd/steamcmd:latest@sha256:c0f1d52b97361919db70034a67b05d2b128061d58a6f8b4bf66787b2aaeeb17d}
      VALMIN_LOG_FORMAT: json
    volumes:
      - ${VALMIN_HOST_DATA_ROOT:?}:/srv/valmin
    # Longer than the panel's 60s shutdown grace, so running jobs can finish.
    stop_grace_period: 75s
    depends_on:
      docker-proxy:
        condition: service_started
    networks:
      docker:
        ipv4_address: ${VALMIN_SUBNET_PREFIX:-10.89}.14.3
      valmin:
        ipv4_address: ${VALMIN_SUBNET_PREFIX:-10.89}.13.3
      games:
        # The last address, so game containers that Docker restarts first do not take it.
        ipv4_address: ${VALMIN_SUBNET_PREFIX:-10.89}.15.254

  # Limits the panel to the Docker API calls it makes. Creating containers with bind mounts is
  # still root-equivalent on the host.
  docker-proxy:
    image: ${VALMIN_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459}
    restart: unless-stopped
    environment:
      # Kept in step with internal/runtime by internal/runtime/surface_test.go.
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      PING: 1
      VERSION: 1
      EVENTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      docker:
        ipv4_address: ${VALMIN_SUBNET_PREFIX:-10.89}.14.2

  caddy:
    image: ${VALMIN_CADDY_IMAGE:-caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f}
    restart: unless-stopped
    ports:
      - "${VALMIN_HTTP_PORT:-80}:80"
      - "${VALMIN_HTTPS_PORT:-443}:443"
      - "${VALMIN_HTTPS_PORT:-443}:443/udp"
    environment:
      VALMIN_DOMAIN: ${VALMIN_DOMAIN:?}
      VALMIN_TLS: ${VALMIN_TLS:-}
      VALMIN_HSTS: ${VALMIN_HSTS:-max-age=31536000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      valmin:
        ipv4_address: ${VALMIN_SUBNET_PREFIX:-10.89}.13.2
    depends_on:
      valmind:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

# VALMIN_SUBNET_PREFIX moves all three subnets and every static address together. Set it
# before the first start: Compose does not change the subnet of an existing network.
networks:
  # The panel and the socket proxy, with no route off the host.
  docker:
    internal: true
    ipam:
      config:
        - subnet: ${VALMIN_SUBNET_PREFIX:-10.89}.14.0/24
  # Caddy and the panel.
  valmin:
    ipam:
      config:
        - subnet: ${VALMIN_SUBNET_PREFIX:-10.89}.13.0/24
  # The panel and every game container. The /24 caps how many servers one host can run.
  games:
    name: valmin-games
    ipam:
      config:
        - subnet: ${VALMIN_SUBNET_PREFIX:-10.89}.15.0/24
