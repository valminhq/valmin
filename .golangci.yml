version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: true

linters:
  enable:
    # Standard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Error handling (06 §4)
    - wrapcheck
    - errorlint
    - nilerr

    # Security (02 §6)
    - gosec
    - bidichk

    # Context threading (06 §4)
    - contextcheck
    - noctx
    - bodyclose

    # Exhaustive switches over typed constants (C8)
    - exhaustive

    # Style
    - misspell
    - whitespace
    - godot
    - nolintlint
    - revive

    # Complexity
    - gocyclo
    - gocognit
    - gocritic
    - nestif
    - nakedret
    - unparam
    - reassign
    - prealloc

    # Duplication
    - dupl
    - goconst

    # Additional Complexity & Maintainability
    - funlen
    - cyclop
    - maintidx

    - sqlclosecheck
    - rowserrcheck

  settings:
    errcheck:
      check-type-assertions: true

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    gocritic:
      enabled-tags: [diagnostic, experimental, opinionated, performance, style]

    gosec:
      severity: medium
      confidence: medium

    nolintlint:
      require-explanation: true
      require-specific: true

    revive:
      rules:
        - name: exported
          disabled: true

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - errors.Unwrap(

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    godot:
      scope: declarations
      capital: false

    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 5
    funlen:
      lines: 100
      statements: 50
    cyclop:
      max-complexity: 15
      package-average: 10.0
    maintidx:
      # Issue reported if maintainability index is below this number
      under: 20

  exclusions:
    # The SPA tree is not Go source. Some npm packages ship .go files.
    paths:
      - ^web/
    rules:
      # A test's fixture strings, table shape and length are its documentation. goconst
      # reads repeated fixture values as missing constants, dupl reads two tables of the
      # same shape as copy-paste, and cyclop/funlen/maintidx read a long assertion
      # sequence as complexity. None of that holds for a table-driven test.
      - path: _test\.go
        linters:
          [
            errcheck,
            noctx,
            wrapcheck,
            gosec,
            gocognit,
            gocyclo,
            goconst,
            dupl,
            cyclop,
            funlen,
            maintidx,
          ]

      # G124 requires HttpOnly on every cookie and cannot express a double-submit token.
      # 11 §6.2's valmin_csrf cookie is deliberately readable by JS — the SPA has to echo
      # it back in X-CSRF-Token — and is Secure + SameSite=Strict, asserted by a test.
      - path: internal/api/middleware/csrf\.go
        linters: [gosec]
        text: G124

formatters:
  enable:
    - gci
    - gofumpt
    - golines

  settings:
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false
      reformat-tags: true
      chain-split-dots: true

    gci:
      sections:
        - standard
        - default
        - prefix(github.com/valminhq/valmin)

  exclusions:
    paths:
      - ^web/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
